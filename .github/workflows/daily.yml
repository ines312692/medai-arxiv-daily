name: Daily arXiv digest

on:
  schedule:
    - cron: "23 6 * * *"   # every day 06:23 UTC (after arXiv's daily announcement)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch papers and build digests
        run: python scripts/update.py
      - name: Commit and push
        env:
          GIT_NAME: ${{ vars.GIT_NAME }}
          GIT_EMAIL: ${{ vars.GIT_EMAIL }}
        run: |
          git config user.name  "${GIT_NAME:-github-actions[bot]}"
          git config user.email "${GIT_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new today."
            exit 0
          fi
          N=$(python -c "import json;print(len(json.load(open('data/papers.json'))))")
          git commit -m "digest: $(date -u +%F) — $N papers tracked"
          git push
